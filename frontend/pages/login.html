<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE Login</title>
    <link rel="icon" href="../assets/images/spectrelogo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <!-- Main wrapper for the two-column layout -->
    <div class="auth-wrapper">
        <!-- Left side: 3D Interactive Shield -->
        <div class="shield-container" id="shield-container">
            <!-- The 3D canvas will be injected here by JavaScript -->
        </div>

        <!-- Right side: Login Form -->
        <div class="login-container">
            <h1>Welcome Back</h1>
            <p>Authenticate to access the SPECTRE platform.</p>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username // admin" required>
                <input type="password" placeholder="Password // 123" required>
                <button type="submit">Authenticate & Enter</button>
            </form>
            <p class="message" id="loginMessage"></p>
        </div>
    </div>

    <!-- Add Three.js library for the 3D shield -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>

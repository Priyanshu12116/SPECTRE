<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE Login</title>
    <link rel="icon" href="../../assets/images/spectrelogo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/auth.css">
    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- Main wrapper for the two-column layout -->
    <div class="auth-wrapper">
        <!-- Left side: 3D Interactive Shield -->
        <div class="shield-container" id="shield-container">
            <!-- The 3D canvas will be injected here by JavaScript -->
        </div>

        <!-- Right side: Login Form -->
        <div class="login-container">
            <h1>Welcome Back</h1>
            <p>Authenticate to access the SPECTRE platform.</p>

            <!-- Google Sign-In Button -->
            <div class="google-signin-section">
                <div id="g_id_onload"
                    data-client_id="795265981701-mlg3ae9opje7rjtaekdr2vcafvf91m7m.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse" data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black"
                    data-text="signin_with" data-shape="rectangular" data-logo_alignment="left" data-width="100%">
                </div>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <form id="loginForm">
                <input type="text" id="username" placeholder="Username or Email" required>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <button type="submit">Authenticate & Enter</button>
            </form>
            <p class="message" id="loginMessage"></p>

            <div class="auth-switch">
                <p>Don't have an account? <a href="signup.html" class="link">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Add Three.js library for the 3D shield -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Shared utilities for common functionality -->
    <script src="../js/shared-utils.js"></script>
    <!-- SECURITY: Crypto utilities for password hashing -->
    <script src="../js/crypto-utils.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
